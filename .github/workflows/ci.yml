name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder and verification tools
        run: python -m pip install -e "builder[test]"
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" actionlint
          sudo install --mode 0755 actionlint /usr/local/bin/actionlint
      - name: Validate all GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflows < <(
            find .github/workflows -type f -name "*.yml" -print0 | sort -z
          )
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "No workflow files found." >&2
            exit 1
          fi
          actionlint -color "${workflows[@]}"
      - name: Run tests
        run: python -m pytest builder/tests -q
      - name: Run Ruff linter
        run: python -m ruff check builder
      - name: Verify Ruff formatting
        run: python -m ruff format --check builder
      - name: Run mypy
        run: python -m mypy builder/src/media_catalog_builder
