name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - name: Install builder and verification tools
        run: python -m pip install -e "builder[test]"
      - name: Run tests
        run: python -m pytest builder/tests -q
      - name: Run Ruff linter
        run: python -m ruff check builder
      - name: Capture Ruff formatting diagnostics
        run: |
          python -m ruff --version > ruff-format-diagnostic.txt
          python -m ruff format --diff builder >> ruff-format-diagnostic.txt || true
      - name: Upload Ruff formatting diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-diagnostic
          path: ruff-format-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Verify Ruff formatting
        run: python -m ruff format --check builder
      - name: Run mypy
        run: python -m mypy builder/src/media_catalog_builder
