name: Recover 1950-2015 catalog from completed shards

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-1950-2015.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: recover-1950-2015-catalog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"

      - name: Download the 66 completed yearly artifacts
        uses: actions/download-artifact@v4
        with:
          repository: gaato77/media-organizer-catalog
          run-id: 30157271026
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: year-*
          path: downloaded-years
          merge-multiple: false

      - name: Assemble the annual shard tree
        shell: bash
        run: |
          mkdir -p multi-year-probe-output/years
          for year in $(seq 1950 2015); do
            source="downloaded-years/year-${year}"
            target="multi-year-probe-output/years/${year}"
            test -f "${source}/summary.json"
            test -f "${source}/movie.json"
            test -f "${source}/series.json"
            mkdir -p "${target}"
            cp -a "${source}/." "${target}/"
          done

      - name: Consolidate completed annual shards
        run: |
          python builder/scripts/consolidate_year_shards.py \
            --output-dir multi-year-probe-output \
            --start-year 1950 \
            --end-year 2015 | tee multi-year-consolidation.log

      - name: Build and validate the recovered package
        id: package
        continue-on-error: true
        shell: bash
        run: |
          rm -rf multi-year-release multi-year-release-work
          set +e
          python - <<'PY' > recovery-build.log 2>&1
          import json
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path

          from media_catalog_builder.config import CatalogConfig
          from media_catalog_builder.probe_release import build_probe_release

          config = CatalogConfig.load(Path("builder/config/catalog.toml"))
          release_summary = build_probe_release(
              Path("multi-year-probe-output"),
              Path("multi-year-release-work"),
              Path("multi-year-release"),
              config=config,
              schema_path=Path("schema/catalog-schema-v1.sql"),
              version="2026.07.25-recovered",
              published_at=datetime(2026, 7, 25, 17, 30, tzinfo=UTC),
              minimum_app_version="0.1.0",
          )
          source_summary = json.loads(
              Path("multi-year-probe-output/summary.json").read_text(encoding="utf-8")
          )
          combined = {"source": source_summary, "release": release_summary}
          Path("multi-year-release-summary.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          shutil.copyfile(
              "multi-year-release-work/skip-audit.json",
              "multi-year-skip-audit.json",
          )
          print(Path("multi-year-release-summary.json").read_text(encoding="utf-8"))
          PY
          exit_code=$?
          cat recovery-build.log
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "${exit_code}"

      - name: Record recovery file inventory
        if: always()
        shell: bash
        run: |
          {
            echo "Recovery source run: 30157271026"
            echo "Package outcome: ${{ steps.package.outcome }}"
            echo "Package exit code: ${{ steps.package.outputs.exit_code }}"
            echo
            find multi-year-probe-output multi-year-release-work multi-year-release \
              -maxdepth 3 -type f -printf '%s %p\n' 2>/dev/null | sort -n
          } > recovery-files.txt
          cat recovery-files.txt

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-diagnostics-1950-2015
          path: |
            recovery-build.log
            recovery-files.txt
            multi-year-consolidation.log
            multi-year-probe-output/summary.json
            multi-year-release-work
            multi-year-release
            multi-year-release-summary.json
            multi-year-skip-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload recovered catalog package
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: complete-1950-2015-catalog-recovered
          path: |
            multi-year-probe-output/summary.json
            multi-year-release
            multi-year-release-work/catalog.sqlite
            multi-year-release-work/lookup-cases.json
            multi-year-release-work/skip-audit.json
            multi-year-release-summary.json
            multi-year-skip-audit.json
            multi-year-consolidation.log
          if-no-files-found: error
          retention-days: 14

      - name: Fail after preserving diagnostics
        if: steps.package.outcome != 'success'
        run: exit 1
