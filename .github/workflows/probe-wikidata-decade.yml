# Resumable ten-year source and package verification (50k ceiling)
name: Complete 2016-2025 catalog probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata-decade.yml

permissions:
  contents: write

concurrency:
  group: complete-2016-2025-catalog-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-decade:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"

      - name: Restore resumable multi-year cache
        id: multi-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: multi-year-probe-output
          key: multi-year-2016-2025-${{ github.sha }}
          restore-keys: |
            multi-year-2016-2025-

      - name: Restore completed 2025 annual cache
        id: annual-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: annual-probe-output
          key: annual-2025-${{ github.sha }}
          restore-keys: |
            annual-2025-

      - name: Seed completed 2025 year shard
        shell: bash
        run: |
          if test -f annual-probe-output/summary.json \
            && test -f annual-probe-output/movie.json \
            && test -f annual-probe-output/series.json \
            && ! test -f multi-year-probe-output/years/2025/summary.json; then
            mkdir -p multi-year-probe-output/years/2025
            cp -a annual-probe-output/. multi-year-probe-output/years/2025/
          fi

      - name: Upgrade legacy 5000-record month cache
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("multi-year-probe-output/years")
          for summary_path in root.glob("*/months/*/summary.json"):
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              saturated = False
              for result in payload.get("results", []):
                  records = result.get("records")
                  media_type = result.get("media_type")
                  if records == 5000 and media_type in {"movie", "series"}:
                      (summary_path.parent / f"{media_type}.json").unlink(missing_ok=True)
                      saturated = True
              if saturated:
                  summary_path.unlink(missing_ok=True)
                  year_dir = summary_path.parents[2]
                  for name in ("summary.json", "movie.json", "series.json"):
                      (year_dir / name).unlink(missing_ok=True)
          PY

      - name: Verify multi-year probe code
        id: verify
        shell: bash
        run: |
          set +e
          {
            python -m pytest builder/tests -q &&
            python -m ruff check builder &&
            python -m ruff format --check builder &&
            python -m mypy builder/src/media_catalog_builder &&
            python builder/scripts/smoke_lookup.py
          } > multi-year-verification.log 2>&1
          status=$?
          cat multi-year-verification.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run resumable complete 2016-2025 probe
        id: multi_year_probe
        if: ${{ steps.verify.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set +e
          rm -f \
            multi-year-probe-output/summary.json \
            multi-year-probe-output/movie.json \
            multi-year-probe-output/series.json
          python builder/scripts/probe_wikidata_multi_year.py \
            --config builder/config/catalog.toml \
            --output-dir multi-year-probe-output \
            --start-year 2016 \
            --end-year 2025 \
            --limit 50000 > multi-year-probe.log 2>&1
          status=$?
          cat multi-year-probe.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save resumable multi-year cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: multi-year-probe-output
          key: multi-year-2016-2025-${{ github.sha }}

      - name: Build and validate 2016-2025 package
        id: package_probe
        if: ${{ steps.verify.outputs.exit_code == '0' && steps.multi_year_probe.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set +e
          rm -rf multi-year-release multi-year-release-work
          python - <<'PY' > multi-year-package.log 2>&1
          import json
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path

          from media_catalog_builder.config import CatalogConfig
          from media_catalog_builder.probe_release import build_probe_release

          config = CatalogConfig.load(Path("builder/config/catalog.toml"))
          release_summary = build_probe_release(
              Path("multi-year-probe-output"),
              Path("multi-year-release-work"),
              Path("multi-year-release"),
              config=config,
              schema_path=Path("schema/catalog-schema-v1.sql"),
              version="2026.07.24",
              published_at=datetime(2026, 7, 24, 23, 55, tzinfo=UTC),
              minimum_app_version="0.1.0",
          )
          source_summary = json.loads(
              Path("multi-year-probe-output/summary.json").read_text(encoding="utf-8")
          )
          combined = {
              "source": source_summary,
              "release": release_summary,
          }
          Path("multi-year-release-summary.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          shutil.copyfile(
              "multi-year-release-work/skip-audit.json",
              "multi-year-skip-audit.json",
          )
          print(Path("multi-year-release-summary.json").read_text(encoding="utf-8"))
          PY
          status=$?
          cat multi-year-package.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build reviewable multi-year result
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          MULTI_YEAR_EXIT_CODE: ${{ steps.multi_year_probe.outputs.exit_code }}
          PACKAGE_EXIT_CODE: ${{ steps.package_probe.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def code(name: str):
              value = os.environ.get(name)
              return int(value) if value else None

          verify_code = code("VERIFY_EXIT_CODE")
          multi_year_code = code("MULTI_YEAR_EXIT_CODE")
          package_code = code("PACKAGE_EXIT_CODE")
          result = {
              "python": "3.12",
              "verification_exit_code": verify_code,
              "multi_year_probe_exit_code": multi_year_code,
              "package_exit_code": package_code,
              "status": (
                  "success"
                  if verify_code == 0 and multi_year_code == 0 and package_code == 0
                  else "failed"
              ),
          }

          release_summary = Path("multi-year-release-summary.json")
          if release_summary.exists():
              result.update(json.loads(release_summary.read_text(encoding="utf-8")))
          else:
              for name in (
                  "multi-year-verification.log",
                  "multi-year-probe.log",
                  "multi-year-package.log",
              ):
                  path = Path(name)
                  if path.exists():
                      result[f"{path.stem}_tail"] = path.read_text(
                          encoding="utf-8", errors="replace"
                      )[-8000:]

          target = Path("probe-results/years-2016-2025.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-2016-2025-catalog-probe
          path: |
            multi-year-probe-output
            multi-year-release
            multi-year-release-work/catalog.sqlite
            multi-year-release-work/lookup-cases.json
            multi-year-release-work/skip-audit.json
            multi-year-release-summary.json
            multi-year-skip-audit.json
            multi-year-verification.log
            multi-year-probe.log
            multi-year-package.log
            probe-results/years-2016-2025.json
          if-no-files-found: warn

      - name: Save multi-year result on feature branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/years-2016-2025.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record complete 2016-2025 catalog probe"
          git pull --rebase origin feature/compact-catalog-builder
          git push origin HEAD:feature/compact-catalog-builder

      - name: Enforce successful multi-year verification and package
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          MULTI_YEAR_EXIT_CODE: ${{ steps.multi_year_probe.outputs.exit_code }}
          PACKAGE_EXIT_CODE: ${{ steps.package_probe.outputs.exit_code }}
        run: |
          test "${VERIFY_EXIT_CODE:-1}" = "0"
          test "${MULTI_YEAR_EXIT_CODE:-1}" = "0"
          test "${PACKAGE_EXIT_CODE:-1}" = "0"
