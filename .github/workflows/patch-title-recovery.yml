name: Apply title recovery integration patch

on:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/patch-title-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compact-catalog-builder
          fetch-depth: 0
      - name: Preserve aliases and publish audit artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          release_path = Path("builder/src/media_catalog_builder/release.py")
          release = release_path.read_text(encoding="utf-8")
          old = '''    originals = {
              title.strip() for record in records for title in record.original_titles if title.strip()
          }
          modified_values = [record.modified_at for record in records if record.modified_at]
          return SourceRecord(
              qid=records[0].qid,
              media_type=max((record.media_type for record in records), key=int),
              year=min(record.year for record in records),
              original_titles=tuple(sorted(originals, key=_text_sort_key)),
              english_label=_first_label(records, "english_label"),
              spanish_label=_first_label(records, "spanish_label"),
              modified_at=max(modified_values) if modified_values else None,
          )
          '''
          new = '''    originals = {
              title.strip() for record in records for title in record.original_titles if title.strip()
          }
          alternates = {
              title.strip() for record in records for title in record.alternate_titles if title.strip()
          }
          modified_values = [record.modified_at for record in records if record.modified_at]
          return SourceRecord(
              qid=records[0].qid,
              media_type=max((record.media_type for record in records), key=int),
              year=min(record.year for record in records),
              original_titles=tuple(sorted(originals, key=_text_sort_key)),
              english_label=_first_label(records, "english_label"),
              spanish_label=_first_label(records, "spanish_label"),
              modified_at=max(modified_values) if modified_values else None,
              alternate_titles=tuple(sorted(alternates, key=_text_sort_key)),
          )
          '''
          if old not in release:
              raise SystemExit("release merge block did not match")
          release_path.write_text(release.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/probe-wikidata.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = "            probe-release-work/lookup-cases.json\n"
          addition = marker + "            probe-release-work/skip-audit.json\n"
          if "probe-release-work/skip-audit.json" not in workflow:
              if marker not in workflow:
                  raise SystemExit("probe artifact marker did not match")
              workflow_path.write_text(workflow.replace(marker, addition, 1), encoding="utf-8")

          Path(".github/workflows/patch-title-recovery.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve recovered aliases in catalog build"
          git pull --rebase origin feature/compact-catalog-builder
          git push origin HEAD:feature/compact-catalog-builder
