name: SPARQL source probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml

permissions:
  contents: write

jobs:
  diagnose-wdqs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3"
      - name: Probe isolated television-series hierarchy
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          endpoint = "https://query.wikidata.org/sparql"
          query = """PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX wdt: <http://www.wikidata.org/prop/direct/>
          SELECT DISTINCT ?class WHERE {
            ?class wdt:P279* wd:Q5398426 .
          }
          ORDER BY ?class
          LIMIT 1000
          """
          result = {
              "endpoint": endpoint,
              "request_method": "POST",
              "query_shape": "isolated subclass closure for Q5398426",
              "limit": 1000,
          }
          started = time.perf_counter()
          try:
              response = requests.post(
                  endpoint,
                  data={"query": query, "format": "json"},
                  headers={
                      "Accept": "application/sparql-results+json",
                      "User-Agent": "MediaOrganizerCatalog/1.0 (https://github.com/gaato77/media-organizer-catalog)",
                  },
                  timeout=70,
              )
              result["elapsed_seconds"] = round(time.perf_counter() - started, 3)
              result["status_code"] = response.status_code
              result["content_type"] = response.headers.get("Content-Type", "")
              result["response_bytes"] = len(response.content)
              try:
                  payload = response.json()
              except ValueError:
                  result["json"] = False
                  result["body_preview"] = response.text[:500]
              else:
                  result["json"] = True
                  bindings = payload.get("results", {}).get("bindings", []) if isinstance(payload, dict) else []
                  result["class_count"] = len(bindings) if isinstance(bindings, list) else None
                  if isinstance(bindings, list):
                      result["sample_classes"] = [
                          row.get("class", {}).get("value", "")
                          for row in bindings[:10]
                          if isinstance(row, dict)
                      ]
                  result["hit_limit"] = len(bindings) == 1000 if isinstance(bindings, list) else None
          except Exception as exc:
              result["elapsed_seconds"] = round(time.perf_counter() - started, 3)
              result["exception_type"] = type(exc).__name__
              result["exception"] = str(exc)[:500]

          target = Path("probe-results/wdqs-series-classes.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wdqs-series-classes-diagnostic
          path: probe-results/wdqs-series-classes.json
      - name: Save diagnostic on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/wdqs-series-classes.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record series class hierarchy diagnostic"
          git push
