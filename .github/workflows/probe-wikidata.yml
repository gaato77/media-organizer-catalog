name: Direct movie class probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3"
      - name: Query direct movie instances only
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          endpoint = "https://query.wikidata.org/sparql"
          query = """PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX wdt: <http://www.wikidata.org/prop/direct/>
          PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
          SELECT ?item (MIN(?releaseDateValue) AS ?releaseDate) WHERE {
            ?item wdt:P31 wd:Q11424 ;
                  wdt:P345 ?imdbId ;
                  wdt:P577 ?releaseDateValue .
            FILTER(
              ?releaseDateValue >= "2025-01-01T00:00:00Z"^^xsd:dateTime &&
              ?releaseDateValue < "2025-02-01T00:00:00Z"^^xsd:dateTime
            )
          }
          GROUP BY ?item
          ORDER BY ?item
          LIMIT 1000
          """
          result = {
              "endpoint": endpoint,
              "media_type": "movie",
              "query_shape": "direct P31 Q11424 only",
              "request_method": "POST",
          }
          started = time.perf_counter()
          try:
              response = requests.post(
                  endpoint,
                  data={"query": query, "format": "json"},
                  headers={
                      "Accept": "application/sparql-results+json",
                      "User-Agent": "MediaOrganizerCatalog/1.0 (https://github.com/gaato77/media-organizer-catalog)",
                  },
                  timeout=70,
              )
              result["elapsed_seconds"] = round(time.perf_counter() - started, 3)
              result["status_code"] = response.status_code
              result["content_type"] = response.headers.get("Content-Type", "")
              result["response_bytes"] = len(response.content)
              response.raise_for_status()
              payload = response.json()
              bindings = payload.get("results", {}).get("bindings", [])
              result["item_count"] = len(bindings)
              result["hit_limit"] = len(bindings) == 1000
              result["success"] = True
          except Exception as exc:
              result["elapsed_seconds"] = round(time.perf_counter() - started, 3)
              result["success"] = False
              result["exception_type"] = type(exc).__name__
              result["exception"] = str(exc)[:500]

          target = Path("probe-results/direct-movie-root.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-movie-root
          path: probe-results/direct-movie-root.json
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/direct-movie-root.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record direct movie root probe"
          git push
