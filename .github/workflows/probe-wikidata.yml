# Complete January 2025 source and release-package verification
name: Production catalog source probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml
      - builder/**
      - schema/**
      - samples/**

permissions:
  contents: write

concurrency:
  group: production-catalog-source-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"

      - name: Verify code and SQLite smoke build
        id: verify
        shell: bash
        run: |
          set +e
          {
            python -m pytest builder/tests -q &&
            python -m ruff check builder &&
            python -m ruff format --check builder &&
            python -m mypy builder/src/media_catalog_builder &&
            python builder/scripts/smoke_lookup.py
          } > verification.log 2>&1
          status=$?
          cat verification.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run complete January 2025 production probe
        id: catalog_probe
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python builder/scripts/probe_wikidata.py \
            --config builder/config/catalog.toml \
            --output-dir probe-output \
            --start 2025-01-01T00:00:00Z \
            --end 2025-02-01T00:00:00Z \
            --limit 1000 > probe.log 2>&1
          status=$?
          cat probe.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and validate monthly release package
        id: package_probe
        if: steps.catalog_probe.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python - <<'PY' > package.log 2>&1
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          from media_catalog_builder.config import CatalogConfig
          from media_catalog_builder.probe_release import build_probe_release

          config = CatalogConfig.load(Path("builder/config/catalog.toml"))
          summary = build_probe_release(
              Path("probe-output"),
              Path("probe-release-work"),
              Path("probe-release"),
              config=config,
              schema_path=Path("schema/catalog-schema-v1.sql"),
              version="2026.07.24",
              published_at=datetime(2026, 7, 24, 23, 0, tzinfo=UTC),
              minimum_app_version="0.1.0",
          )
          target = Path("probe-release-summary.json")
          target.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY
          status=$?
          cat package.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build reviewable result
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          PROBE_EXIT_CODE: ${{ steps.catalog_probe.outputs.exit_code }}
          PACKAGE_EXIT_CODE: ${{ steps.package_probe.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          verify_code = int(os.environ.get("VERIFY_EXIT_CODE") or 1)
          probe_value = os.environ.get("PROBE_EXIT_CODE")
          probe_code = int(probe_value) if probe_value else None
          package_value = os.environ.get("PACKAGE_EXIT_CODE")
          package_code = int(package_value) if package_value else None
          result = {
              "python": "3.12",
              "verification_exit_code": verify_code,
              "probe_exit_code": probe_code,
              "package_exit_code": package_code,
              "status": (
                  "success"
                  if verify_code == 0 and probe_code == 0 and package_code == 0
                  else "failed"
              ),
          }

          verification_log = Path("verification.log")
          if verification_log.exists():
              result["verification_log_tail"] = verification_log.read_text(
                  encoding="utf-8", errors="replace"
              )[-4000:]

          summary_path = Path("probe-output/summary.json")
          if summary_path.exists():
              result["summary"] = json.loads(summary_path.read_text(encoding="utf-8"))
          else:
              probe_log = Path("probe.log")
              if probe_log.exists():
                  result["probe_log_tail"] = probe_log.read_text(
                      encoding="utf-8", errors="replace"
                  )[-4000:]

          release_summary = Path("probe-release-summary.json")
          if release_summary.exists():
              result["monthly_release"] = json.loads(
                  release_summary.read_text(encoding="utf-8")
              )
          else:
              package_log = Path("package.log")
              if package_log.exists():
                  result["package_log_tail"] = package_log.read_text(
                      encoding="utf-8", errors="replace"
                  )[-4000:]

          target = Path("probe-results/production-paginated.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-catalog-source-probe
          path: |
            build/sample.sqlite
            probe-output
            probe-release
            probe-release-work/catalog.sqlite
            probe-release-work/lookup-cases.json
            probe-release-work/skip-audit.json
            probe-release-summary.json
            verification.log
            probe.log
            package.log
            probe-results/production-paginated.json
          if-no-files-found: warn

      - name: Save result on feature branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/production-paginated.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record January package checkpoint"
          git push

      - name: Enforce successful verification, probe, and package
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          PROBE_EXIT_CODE: ${{ steps.catalog_probe.outputs.exit_code }}
          PACKAGE_EXIT_CODE: ${{ steps.package_probe.outputs.exit_code }}
        run: |
          test "${VERIFY_EXIT_CODE:-1}" = "0"
          test "${PROBE_EXIT_CODE:-1}" = "0"
          test "${PACKAGE_EXIT_CODE:-1}" = "0"
