name: Optimized catalog source probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml
      - builder/scripts/probe_wikidata.py
      - builder/src/media_catalog_builder/config.py
      - builder/src/media_catalog_builder/http.py
      - builder/src/media_catalog_builder/wikidata.py
      - builder/tests/test_config.py
      - builder/tests/test_http.py
      - builder/tests/test_probe.py
      - builder/tests/test_wikidata.py

permissions:
  contents: write

jobs:
  verify-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"
      - name: Verify code on Python 3.12
        id: verify
        shell: bash
        run: |
          set +e
          {
            python -m pytest builder/tests -q &&
            python -m ruff check builder &&
            python -m ruff format --check builder &&
            python -m mypy builder/src/media_catalog_builder
          } > verification.log 2>&1
          status=$?
          cat verification.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run optimized production probe
        id: probe
        if: steps.verify.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python builder/scripts/probe_wikidata.py \
            --config builder/config/catalog.toml \
            --output-dir probe-output \
            --start 2025-01-01T00:00:00Z \
            --end 2025-02-01T00:00:00Z \
            --limit 25 > probe.log 2>&1
          status=$?
          cat probe.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build reviewable result
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          verify_exit = int(os.environ.get("VERIFY_EXIT_CODE") or 1)
          probe_value = os.environ.get("PROBE_EXIT_CODE")
          probe_exit = int(probe_value) if probe_value else None
          result = {
              "python": "3.12",
              "verification_exit_code": verify_exit,
              "probe_exit_code": probe_exit,
              "status": "success" if verify_exit == 0 and probe_exit == 0 else "failed",
          }
          verification_log = Path("verification.log").read_text(
              encoding="utf-8", errors="replace"
          )
          result["verification_log_tail"] = verification_log[-4000:]
          summary_path = Path("probe-output/summary.json")
          if summary_path.exists():
              result["summary"] = json.loads(summary_path.read_text(encoding="utf-8"))
          elif Path("probe.log").exists():
              result["probe_log_tail"] = Path("probe.log").read_text(
                  encoding="utf-8", errors="replace"
              )[-4000:]

          target = Path("probe-results/production-probe.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-production-probe
          path: |
            verification.log
            probe.log
            probe-output
            probe-results/production-probe.json
          if-no-files-found: warn
      - name: Save probe result on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/production-probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record optimized production probe"
          git push
