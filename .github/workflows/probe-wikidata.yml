name: Wikidata probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml
      - builder/scripts/probe_wikidata.py
      - builder/src/media_catalog_builder/classify.py
      - builder/src/media_catalog_builder/http.py
      - builder/src/media_catalog_builder/probe.py
      - builder/src/media_catalog_builder/wikidata.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e builder
      - name: Run bounded monthly probe
        id: probe
        shell: bash
        run: |
          set +e
          python builder/scripts/probe_wikidata.py \
            --config builder/config/catalog.toml \
            --output-dir probe-output \
            --start 2025-01-01T00:00:00Z \
            --end 2025-02-01T00:00:00Z \
            --limit 25 > probe.log 2>&1
          status=$?
          cat probe.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build reviewable result
        env:
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          exit_code = int(os.environ["PROBE_EXIT_CODE"])
          summary_path = Path("probe-output/summary.json")
          log = Path("probe.log").read_text(encoding="utf-8", errors="replace")
          result = {
              "status": "success" if exit_code == 0 else "failed",
              "exit_code": exit_code,
          }
          if summary_path.exists():
              result["summary"] = json.loads(summary_path.read_text(encoding="utf-8"))
          else:
              result["log_tail"] = log[-4000:]
          target = Path("probe-results/latest.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wikidata-probe
          path: |
            probe-output
            probe.log
            probe-results/latest.json
          if-no-files-found: warn
      - name: Save probe summary on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record bounded Wikidata probe result"
          git push
