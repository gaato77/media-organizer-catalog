name: SPARQL source probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/compact-catalog-builder
    paths:
      - .github/workflows/probe-wikidata.yml

permissions:
  contents: write

jobs:
  diagnose-qlever:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.32,<3"
      - name: Probe QLever response format
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import requests

          endpoint = "https://qlever.dev/api/wikidata"
          query = """PREFIX wd: <http://www.wikidata.org/entity/>
          SELECT ?item WHERE {
            VALUES ?item { wd:Q42 }
          }
          LIMIT 1
          """
          result = {
              "endpoint": endpoint,
              "request_method": "GET",
              "requested_action": "sparql_json_export",
          }
          try:
              response = requests.get(
                  endpoint,
                  params={"query": query, "action": "sparql_json_export"},
                  headers={
                      "Accept": "application/sparql-results+json",
                      "User-Agent": "MediaOrganizerCatalog/1.0 (https://github.com/gaato77/media-organizer-catalog)",
                  },
                  timeout=70,
              )
              result["status_code"] = response.status_code
              result["content_type"] = response.headers.get("Content-Type", "")
              result["response_bytes"] = len(response.content)
              try:
                  payload = response.json()
              except ValueError:
                  result["json"] = False
                  result["body_preview"] = response.text[:500]
              else:
                  result["json"] = True
                  result["top_level_type"] = type(payload).__name__
                  if isinstance(payload, dict):
                      result["top_level_keys"] = sorted(payload.keys())
                      bindings = payload.get("results", {}).get("bindings", [])
                      result["standard_binding_count"] = len(bindings) if isinstance(bindings, list) else None
                  result["payload_preview"] = json.dumps(payload, ensure_ascii=False)[:500]
          except Exception as exc:
              result["exception_type"] = type(exc).__name__
              result["exception"] = str(exc)[:500]

          target = Path("probe-results/qlever-api.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(target.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qlever-api-diagnostic
          path: probe-results/qlever-api.json
      - name: Save diagnostic on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/qlever-api.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record QLever API diagnostic"
          git push
