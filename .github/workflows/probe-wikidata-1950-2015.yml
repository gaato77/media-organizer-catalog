# Manual year-sharded historical source and package verification
name: Complete 1950-2015 catalog probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-1950-2015-catalog-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"
      - run: python -m pytest builder/tests -q
      - run: python -m ruff check builder
      - run: python -m ruff format --check builder
      - run: python -m mypy builder/src/media_catalog_builder
      - run: python builder/scripts/smoke_lookup.py

  shards:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year:
          - 1950
          - 1951
          - 1952
          - 1953
          - 1954
          - 1955
          - 1956
          - 1957
          - 1958
          - 1959
          - 1960
          - 1961
          - 1962
          - 1963
          - 1964
          - 1965
          - 1966
          - 1967
          - 1968
          - 1969
          - 1970
          - 1971
          - 1972
          - 1973
          - 1974
          - 1975
          - 1976
          - 1977
          - 1978
          - 1979
          - 1980
          - 1981
          - 1982
          - 1983
          - 1984
          - 1985
          - 1986
          - 1987
          - 1988
          - 1989
          - 1990
          - 1991
          - 1992
          - 1993
          - 1994
          - 1995
          - 1996
          - 1997
          - 1998
          - 1999
          - 2000
          - 2001
          - 2002
          - 2003
          - 2004
          - 2005
          - 2006
          - 2007
          - 2008
          - 2009
          - 2010
          - 2011
          - 2012
          - 2013
          - 2014
          - 2015
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"

      - name: Restore yearly shard cache
        id: year-cache
        uses: actions/cache/restore@v4
        with:
          path: year-probe-output
          key: year-probe-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            year-probe-${{ matrix.year }}-

      - name: Build resumable yearly shard
        run: |
          python builder/scripts/probe_wikidata_year.py \
            --config builder/config/catalog.toml \
            --output-dir year-probe-output \
            --year ${{ matrix.year }} \
            --limit 50000 | tee year-${{ matrix.year }}.log

      - name: Validate completed yearly shard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          year = int("${{ matrix.year }}")
          root = Path("year-probe-output")
          required = [root / "summary.json", root / "movie.json", root / "series.json"]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing yearly shard files: {missing}")
          summary = json.loads(required[0].read_text(encoding="utf-8"))
          if summary.get("year") != year or summary.get("month_count") != 12:
              raise SystemExit(f"invalid yearly shard summary for {year}")
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Save resumable yearly shard cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: year-probe-output
          key: year-probe-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload completed yearly shard
        uses: actions/upload-artifact@v4
        with:
          name: year-${{ matrix.year }}
          path: year-probe-output
          if-no-files-found: error
          retention-days: 14

  consolidate:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/pyproject.toml
      - run: python -m pip install -e "builder[test]"

      - name: Download all completed yearly shards
        uses: actions/download-artifact@v4
        with:
          pattern: year-*
          path: downloaded-years
          merge-multiple: false

      - name: Assemble the annual shard tree
        shell: bash
        run: |
          mkdir -p multi-year-probe-output/years
          for year in $(seq 1950 2015); do
            source="downloaded-years/year-${year}"
            target="multi-year-probe-output/years/${year}"
            test -f "${source}/summary.json"
            test -f "${source}/movie.json"
            test -f "${source}/series.json"
            mkdir -p "${target}"
            cp -a "${source}/." "${target}/"
          done

      - name: Consolidate completed annual shards
        run: |
          python builder/scripts/consolidate_year_shards.py \
            --output-dir multi-year-probe-output \
            --start-year 1950 \
            --end-year 2015 | tee multi-year-consolidation.log

      - name: Build and validate the consolidated package
        run: |
          rm -rf multi-year-release multi-year-release-work
          python - <<'PY'
          import json
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path

          from media_catalog_builder.config import CatalogConfig
          from media_catalog_builder.probe_release import build_probe_release

          config = CatalogConfig.load(Path("builder/config/catalog.toml"))
          release_summary = build_probe_release(
              Path("multi-year-probe-output"),
              Path("multi-year-release-work"),
              Path("multi-year-release"),
              config=config,
              schema_path=Path("schema/catalog-schema-v1.sql"),
              version="2026.07.25",
              published_at=datetime(2026, 7, 25, 12, 0, tzinfo=UTC),
              minimum_app_version="0.1.0",
          )
          source_summary = json.loads(
              Path("multi-year-probe-output/summary.json").read_text(encoding="utf-8")
          )
          combined = {"source": source_summary, "release": release_summary}
          Path("multi-year-release-summary.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          shutil.copyfile(
              "multi-year-release-work/skip-audit.json",
              "multi-year-skip-audit.json",
          )
          print(Path("multi-year-release-summary.json").read_text(encoding="utf-8"))
          PY

      - name: Upload consolidated review package
        uses: actions/upload-artifact@v4
        with:
          name: complete-1950-2015-catalog-probe
          path: |
            multi-year-probe-output/summary.json
            multi-year-release
            multi-year-release-work/catalog.sqlite
            multi-year-release-work/lookup-cases.json
            multi-year-release-work/skip-audit.json
            multi-year-release-summary.json
            multi-year-skip-audit.json
            multi-year-consolidation.log
          if-no-files-found: error
          retention-days: 14
